<section class="auth-shell">
  <mat-card class="auth-card">
    <div class="copy">
      <p class="eyebrow">Get started</p>
      <h1>Create your TaskFlow account</h1>
      <p>
        Spin up a MEMBER account and start shaping boards before you wire full identity in.
      </p>
    </div>

    @if (error()) {
      <div class="error-banner">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput type="text" formControlName="name" autocomplete="name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="new-password" />
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" [disabled]="pending()">
        @if (pending()) {
          Creating account...
        } @else {
          Create account
        }
      </button>
    </form>

    <div class="footer-copy">
      <span>Already have an account?</span>
      <a routerLink="/auth/login">Sign in</a>
    </div>
  </mat-card>
</section>
